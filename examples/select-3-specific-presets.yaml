# three buttons to select between three specific presets via PC# 0, PC# 1 and PC# 2 messages
device: /dev/snd/midiC3D1
buttons:
  - caption: clean
    type: radio
    messageOn: C0 00
  - caption: crunch
    type: radio
    messageOn: C0 01
  - caption: overdrive
    type: radio
    messageOn: C0 02
